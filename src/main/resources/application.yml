server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: ontology-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55434/ontology}
    username: ${DB_USER:ontology}
    password: ${DB_PASSWORD:ontology}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    root: INFO
    com.example.ontology: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ontology:
  # 展示时区（存储一律 UTC / timestamptz）
  timezone: Asia/Shanghai
  # AES-GCM 主密钥（Base64，32 字节）。生产必须用环境变量覆盖。
  crypto-key: ${ONTOLOGY_CRYPTO_KEY:b250b2xvZ3ktbXZwLWRlbW8ta2V5LTMyYnl0ZXMhISE=}
  acl:
    # 角色 -> 可见类型 / 可执行 Action / 可读属性（属性级裁剪的数据来源）
    ADMIN:
      types: ["*"]
      actions: ["*"]
      fields: {}
    EDITOR:
      types: ["Airport", "Flight", "Aircraft", "Airline", "Delay"]
      actions: ["CreateFlight", "CancelFlight", "AssignAircraft", "BatchCloseFlights"]
      fields: {}
    VIEWER:
      types: ["Airport", "Flight", "Airline"]
      actions: []
      fields:
        Flight: ["flightNo", "status", "delayMinutes", "departure", "arrival"]
        Airport: ["code", "name", "weather"]
        Airline: ["code", "name"]
