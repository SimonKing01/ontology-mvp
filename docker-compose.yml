services:
  db:
    image: postgres:16
    container_name: ontology-mvp-db
    environment:
      POSTGRES_DB: ontology
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology
      TZ: UTC
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 3s
      timeout: 3s
      retries: 20
